name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Swift / ${{ matrix.runner }} / Xcode ${{ matrix.xcode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '16.4'
          - runner: macos-15-intel
            xcode: '16.4'
          - runner: macos-15
            xcode: '26.3'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Validate roadmap traceability
        run: python3 scripts/audit-roadmap.py
      - name: Build release executable
        run: swift build --configuration release
      - name: Package and verify app bundle
        run: zsh scripts/package.sh
      - name: Run unit and loopback integration tests
        run: bash scripts/test.sh

  build-and-test:
    name: Build and test on macOS
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every macOS configuration to pass
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        run: test "$MATRIX_RESULT" = success
