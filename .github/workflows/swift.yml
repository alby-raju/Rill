name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.plan.outputs.native }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-plan.py
      - run: python3 scripts/check-docs.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Check Python automation formatting
        run: |
          python3 -m venv "$RUNNER_TEMP/python-quality"
          "$RUNNER_TEMP/python-quality/bin/pip" install -r requirements-dev.txt
          "$RUNNER_TEMP/python-quality/bin/ruff" format --check scripts verification
          "$RUNNER_TEMP/python-quality/bin/ruff" check scripts verification
  verify:
    name: Swift / ${{ matrix.runner }} / Xcode ${{ matrix.xcode }}
    needs: plan
    if: needs.plan.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Cold Intel native runtime + protoc + debug test compilation can exceed 30m.
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Identify exact build toolchain
        id: toolchain
        run: |
          RILL_TOOLCHAIN_HASH="$( { xcodebuild -version; swift --version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "fingerprint=$RILL_TOOLCHAIN_HASH" >> "$GITHUB_OUTPUT"
      - name: Restore Swift build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Validate documentation and capability records
        run: python3 scripts/check-docs.py
      - name: Check first-party formatting
        if: matrix.runner == 'macos-15' && matrix.xcode == '26.3'
        run: |
          python3 -m venv "$RUNNER_TEMP/format-tools"
          "$RUNNER_TEMP/format-tools/bin/pip" install -r requirements-dev.txt
          case "$(uname -m)" in
            arm64) RILL_FORMAT_ARCH=arm64; RILL_FORMAT_SHA=b7c872db63553ccffc7253aba3ed7d4885a27d83f1ba567b1138c6315a5847e5 ;;
            x86_64) RILL_FORMAT_ARCH=amd64; RILL_FORMAT_SHA=d33eee0da0f92835b3562e9767a05cee7e4eaeef47daa03bfd09da17b4b590a6 ;;
            *) echo 'Unsupported formatter architecture' >&2; exit 1 ;;
          esac
          curl --fail --location --silent --show-error "https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_darwin_$RILL_FORMAT_ARCH" --output "$RUNNER_TEMP/shfmt"
          echo "$RILL_FORMAT_SHA  $RUNNER_TEMP/shfmt" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/shfmt"
          RILL_RUFF="$RUNNER_TEMP/format-tools/bin/ruff" RILL_SHFMT="$RUNNER_TEMP/shfmt" bash scripts/format.sh --check
      - name: Build release executable
        run: swift build --configuration release
      - name: Verify pinned dependency notices
        run: python3 scripts/collect-dependency-notices.py --check
      - name: Package and verify app bundle
        run: zsh scripts/package.sh
      - name: Run unit and loopback integration tests
        env:
          RILL_SNIPPET_FIXTURES: ${{ runner.temp }}/rill-client-fixtures
        run: bash scripts/test.sh
      - name: Verify tab resizing with synthetic UI
        run: python3 scripts/verify-tab-resizing.py
      - name: Verify manual acceptance kit
        run: python3 verification/verify.py --cli "$(swift build --show-bin-path)/RillCLI"
      - name: Upload synthetic generated programs
        if: matrix.runner == 'macos-15' && matrix.xcode == '26.3'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-client-fixtures
          path: ${{ runner.temp }}/rill-client-fixtures
          retention-days: 2

      - name: Save trusted Swift build cache
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  clients:
    name: Compile and execute generated clients
    needs: [plan, verify]
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-client-fixtures
          path: fixtures
      - name: Select preinstalled .NET 10 SDK
        run: |
          dotnet --list-sdks
          RILL_CLIENT_DOTNET_SDK="$(dotnet --list-sdks | awk '$1 ~ /^10[.]0[.][0-9]+$/ {print $1}' | sort -V | tail -n 1)"
          if [ -z "$RILL_CLIENT_DOTNET_SDK" ]; then
            echo 'The runner must provide a stable .NET 10 SDK; no rolling download fallback is used.' >&2
            exit 1
          fi
          echo "RILL_CLIENT_DOTNET_SDK=$RILL_CLIENT_DOTNET_SDK" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          echo "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1" >> "$GITHUB_ENV"
      - name: Install isolated test SDKs
        run: |
          python3 -m venv "$RUNNER_TEMP/client-python"
          "$RUNNER_TEMP/client-python/bin/pip" install requests==2.34.2 httpx==0.28.1
          npm install --prefix "$RUNNER_TEMP/client-node" --ignore-scripts --no-save axios@1.20.0
          mvn -q -f scripts/client-validation-pom.xml dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/client-classpath"
      - name: Compile and execute synthetic requests on loopback
        run: |
          export RILL_CLIENT_PYTHON="$RUNNER_TEMP/client-python/bin/python"
          export RILL_CLIENT_NODE_MODULES="$RUNNER_TEMP/client-node/node_modules"
          export RILL_CLIENT_JAVA_HOME="$JAVA_HOME_21_X64"
          export RILL_CLIENT_OKHTTP_CLASSPATH="$(cat "$RUNNER_TEMP/client-classpath")"
          export RILL_CLIENT_CARGO_TARGET="$RUNNER_TEMP/client-cargo"
          python3 scripts/validate-clients.py fixtures --targets requests,httpx,fetch,axios,java,okhttp,go,rust,csharp

  build-and-test:
    name: Build and test on macOS
    if: always()
    needs: [plan, verify, clients]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every macOS configuration to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          NATIVE_REQUIRED: ${{ needs.plan.outputs.native }}
          MATRIX_RESULT: ${{ needs.verify.result }}
          CLIENT_RESULT: ${{ needs.clients.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$NATIVE_REQUIRED" = true ]; then
            test "$MATRIX_RESULT" = success && test "$CLIENT_RESULT" = success
          else
            test "$NATIVE_REQUIRED" = false
            test "$MATRIX_RESULT" = skipped && test "$CLIENT_RESULT" = skipped
          fi
