name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: "For sensitive vulnerabilities use SECURITY.md. Never include real credentials, private endpoints or personal workspaces."
  - type: input
    id: version
    attributes:
      label: Rill version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: macOS version, CPU and installation method
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a verification-kit case or a minimal synthetic request where possible.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshots or reports
      description: Include CLI exit code or interaction timing when relevant.
